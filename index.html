<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 | 다함 파트너</title>
    <link rel="stylesheet" href="style.css?v=37">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div class="container-narrow">
        <div class="login-wrap">
            <div class="login-logo-area">
                <img src="logo.png" alt="다함" class="login-logo-img" onerror="this.style.display='none'">
            </div>
            <h1 class="login-title">다함 파트너 시스템</h1>
            
            <div class="input-group-login">
                <input type="text" id="id" class="login-input" placeholder="아이디">
            </div>
            <div class="input-group-login">
                <input type="password" id="pw" class="login-input" placeholder="비밀번호">
            </div>
            <button class="btn-login-action" onclick="login()">로그인</button>
        </div>
    </div>
    <script src="data.js?v=37"></script>
    <script>
        function login() {
            if(document.getElementById('id').value && document.getElementById('pw').value) {
                location.href = 'main.html';
            } else {
                alert("아이디와 비밀번호를 입력해주세요.");
            }
        }
    </script>
</body>
</html>
