<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><title>로그인 | 다함</title>
    <link rel="stylesheet" href="style.css?v=33">
</head>
<body>
<div class="container" style="display:flex; align-items:center; justify-content:center;">
    <div style="text-align:center; width:100%; max-width:300px;">
        <div style="width:120px; height:120px; background:#ddd; margin:0 auto 40px; border-radius:15px; display:flex; align-items:center; justify-content:center;">로고</div>
        <input type="text" id="id" placeholder="ID" style="width:100%; padding:15px; margin-bottom:10px; border:none; border-radius:8px; background:#4a74c9; color:white;">
        <input type="password" id="pw" placeholder="PW" style="width:100%; padding:15px; margin-bottom:15px; border:none; border-radius:8px; background:#4a74c9; color:white;">
        <button onclick="login()" class="btn-orange" style="width:100%; padding:15px; font-size:18px;">로그인</button>
    </div>
</div>
<script src="data.js?v=33"></script>
<script>
    function login() {
        if(document.getElementById('id').value && document.getElementById('pw').value) location.href = 'main.html';
        else alert("아이디와 비번을 입력하세요.");
    }
</script>
</body>
</html>
