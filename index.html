<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="style.css?v=35">
</head>
<body>
    <div class="container">
        <div class="login-wrap">
            <div class="logo-box">
                <img src="logo.png" alt="다함" class="logo-img" onerror="this.style.display='none'">
                <div>다함<br>로고</div>
            </div>
            
            <input type="text" id="id" class="login-input" placeholder="ID">
            <input type="password" id="pw" class="login-input" placeholder="PW">
            <button class="btn-login" onclick="login()">로그인</button>
        </div>
    </div>
    <script src="data.js?v=35"></script>
    <script>
        function login() {
            if(document.getElementById('id').value && document.getElementById('pw').value) location.href = 'main.html';
            else alert('ID와 PW를 입력하세요.');
        }
    </script>
</body>
</html>
