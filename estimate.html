<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>견적서</title>
    <link rel="stylesheet" href="style.css?v=35">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="header-simple no-print">
            <button class="back-btn" onclick="location.href='main.html'">←</button>
            <h2 class="header-title">견적서 작성</h2>
        </div>

        <div class="header-card">
            <div class="header-top">
                <img src="logo.png" alt="다함" class="img-logo">
                <div class="doc-title">견적서</div>
                <div class="rep-info">
                    대표 김재영<br>
                    <span style="color:var(--danger-red); font-weight:800; font-size:18px;">010.5404.8747</span>
                </div>
            </div>
            <div class="info-row">
                <div style="flex:1;">
                    <label>발주처</label>
                    <input type="text" id="g-name" class="info-input" placeholder="고객명">
                </div>
                <div style="flex:1;">
                    <label>연락처</label>
                    <input type="tel" id="g-tel" class="info-input" placeholder="전화번호">
                </div>
            </div>
            <div>
                <label>현장 주소</label>
                <input type="text" id="g-addr" class="info-input" placeholder="주소 입력">
            </div>
        </div>

        <div class="estimate-section">
            <div class="grid-header">
                <div class="col-name">공정 항목</div>
                <div class="col-qty">수량</div>
                <div class="col-price">단가</div>
                <div class="col-sum">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>

        <div class="total-bar">
            <div>예상 견적 합계</div>
            <div id="final-sum" class="total-text">0 원</div>
        </div>

        <div class="bottom-actions">
            <button class="action-btn btn-gray" onclick="resetForm()">초기화</button>
            <button class="action-btn btn-gold" onclick="saveToLocal()">임시저장</button>
            <button class="action-btn btn-navy" onclick="smartPrint()">견적발행</button>
            <button class="action-btn btn-red" onclick="alert('계약서 기능 준비중')">계약서</button>
        </div>
        
        <div id="toast-msg" class="toast">저장되었습니다!</div>
    </div>

    <script src="data.js?v=35"></script>
    <script src="estimate.js?v=35"></script>
</body>
</html>
