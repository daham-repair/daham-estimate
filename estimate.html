<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>견적서 | 다함</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="estimate-body">
    <div class="estimate-container">
        <div class="header-simple no-print">
            <button onclick="location.href='main.html'" style="background:none; border:none; font-size:24px; cursor:pointer;">←</button>
            <h2 style="font-size:22px; font-weight:800; margin:0;">견적서 작성</h2>
        </div>

        <div class="estimate-section">
            <div class="grid-header-fixed quote-grid">
                <div>공정 항목</div>
                <div class="col-center">수량</div>
                <div class="col-center">단가</div>
                <div class="col-right">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>
    </div>

    <div class="floating-action-bar no-print">
        <button class="fab-btn" style="background:#eee; color:#333;" onclick="location.reload()">🔄 초기화</button>
        <button class="fab-btn" style="background:var(--accent-gold);">💾 임시저장</button>
        <button class="fab-btn" style="background:var(--primary-navy);" onclick="window.print()">🖨️ 견적발행</button>
        <button class="fab-btn" style="background:#E03E3E;" onclick="switchToDetailed()">📑 계약서</button>
    </div>

    <script src="data.js"></script>
    <script src="estimate.js"></script>
</body>
</html>
