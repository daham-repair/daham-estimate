<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>견적서 작성 | 다함</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="estimate-container">
        <div class="header-simple no-print">
            <button class="back-nav" onclick="location.href='main.html'">←</button>
            <h2 class="header-doc-title">견적서 작성</h2>
        </div>

        <div class="header-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <img src="logo.png" class="img-logo-small" alt="다함">
                <h1 style="margin:0; font-size:24px; color:var(--primary-navy);">견적서</h1>
            </div>
            </div>

        <div class="estimate-section">
            <div class="grid-header-fixed quote-grid">
                <div>공정 항목</div>
                <div class="col-center">수량</div>
                <div class="col-center">단가</div>
                <div class="col-right">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>
    </div>

    <div class="floating-action-bar no-print">
        <button class="fab-btn btn-reset" onclick="location.reload()">🔄 초기화</button>
        <button class="fab-btn btn-save">💾 임시저장</button>
        <button class="fab-btn btn-print" onclick="window.print()">🖨️ 견적발행</button>
        <button class="fab-btn btn-contract" onclick="alert('계약서 화면으로 전환합니다.')">📑 계약서</button>
    </div>

    <script src="data.js"></script>
    <script src="estimate.js"></script>
</body>
</html>
