<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다함 인테리어 | 통합 관리 시스템</title>
    <link rel="stylesheet" href="style.css?v=29">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
<div class="container">
    
    <div id="view-login" class="active-view">
        <div class="login-wrapper">
            <span class="version-badge top-right">Ver 1.19</span>
            <div class="login-logo-box">
                <img src="logo.png" alt="다함 로고" class="login-logo-img">
                <h2>다함 로고</h2>
            </div>
            <div class="login-form">
                <input type="text" id="login-id" class="login-input" placeholder="ID">
                <input type="password" id="login-pw" class="login-input" placeholder="PW">
                <button class="login-submit-btn" onclick="handleLogin()">로그인</button>
            </div>
        </div>
    </div>

    <div id="view-main-menu">
        <span class="version-badge top-right">Ver 1.19</span>
        <div class="menu-container">
            <button class="menu-big-btn" onclick="showView('view-general')">견적서</button>
            <button class="menu-big-btn" onclick="showView('view-material-calc')">자재산출</button>
            <button class="menu-big-btn gray-btn">공사안내문</button>
        </div>
    </div>

    <div id="view-material-calc">
        <div class="header-simple">
            <button class="back-btn" onclick="showView('view-main-menu')">←</button>
            <h2>자재산출</h2>
        </div>
        <div class="menu-container">
            <button class="menu-sub-btn">목공</button>
            <button class="menu-sub-btn">타일</button>
            <button class="menu-sub-btn">도배, 장판</button>
        </div>
    </div>

    <div id="view-general">
        <div class="header-simple no-print">
            <button class="back-btn" onclick="showView('view-main-menu')">←</button>
            <h2>견적서 작성</h2>
        </div>
        <div class="notice-banner no-print">
            <span>⚠️ 실측 전 참고용 '공식 가견적서'입니다</span>
        </div>

        <div class="header-card">
            <div class="header-top">
                <div class="logo-box"><img src="logo.png" alt="다함 인테리어" class="img-logo"></div>
                <h1 class="doc-title">견적서</h1>
                <div class="rep-info"><strong>대표 김재영</strong><div style="color:var(--danger-red);">010.5404.8747</div></div>
            </div>
            <div class="info-grid">
                <div class="input-group"><label>발주처(고객명)</label><input type="text" id="g-name" class="input-field" placeholder="고객 성함을 입력하세요"></div>
                <div class="input-group"><label>연락처</label><input type="tel" id="g-tel" class="input-field" placeholder="010.0000.0000" maxlength="13"></div>
                <div class="input-group full-row"><label>현장 주소</label><input type="text" id="g-addr" class="input-field" placeholder="시공할 현장 주소를 입력하세요"></div>
            </div>
        </div>
        <div class="estimate-section">
            <div class="grid-header master-grid">
                <div>공정 항목</div><div>수량</div><div>단가</div><div style="text-align:right;">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>
        <div class="total-card"><div>예상 견적 합계</div><div id="final-sum" class="total-val">0 원</div></div>
    </div>

    <div id="view-detailed">
        <div class="header-card">
            <div class="header-top">
                <div class="logo-box"><img src="logo.png" alt="다함 인테리어" class="img-logo"></div>
                <h1 class="doc-title">계약서</h1>
                <div class="rep-info"><strong>공급자: 김재영 (인)</strong><div style="color:var(--danger-red);">010.5404.8747</div></div>
            </div>
            <div class="info-grid">
                <div class="input-group"><label>발주처</label><div id="d-name-display" class="display-text"></div></div>
                <div class="input-group"><label>연락처</label><div id="d-tel-display" class="display-text"></div></div>
                <div class="input-group full-row"><label>현장 주소</label><div id="d-addr-display" class="display-text"></div></div>
            </div>
        </div>
        <div class="estimate-section">
            <div class="grid-header detail-grid">
                <div>공정 및 항목</div><div>자재 사양</div><div>수량</div><div>단가</div><div style="text-align:right;">금액</div>
            </div>
            <div id="detailed-body"></div>
        </div>
        <div class="total-card"><div>최종 시공 합계</div><div id="d-total" class="total-val">0 원</div></div>
    </div>

    <div id="action-bar-container" class="bottom-action-bar no-print" style="display:none;">
        <button id="btn-reset" class="action-btn btn-reset" onclick="resetForm()">초기화</button>
        <button id="btn-save" class="action-btn btn-save" onclick="saveToLocal()">임시저장</button>
        <button id="btn-print-est" class="action-btn btn-print" onclick="smartPrint()">견적발행</button>
        <button id="btn-go-contract" class="action-btn btn-next" onclick="switchToDetailed()">계약서</button>
        <button id="btn-back" class="action-btn btn-reset" onclick="backToGeneral()" style="display:none;">목록으로</button>
        <button id="btn-print-cont" class="action-btn btn-print" onclick="printContract()" style="display:none; flex: 2; background:var(--primary-navy);">계약서 출력</button>
    </div>

    <div id="toast-msg" class="toast">저장되었습니다!</div>
</div>
<script src="data.js?v=29"></script>
<script src="script.js?v=29"></script>
</body>
</html>
