<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>견적서 | 다함</title>
    <link rel="stylesheet" href="style.css?v=38">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container estimate-container">
        <div class="no-print" style="margin-bottom:20px;">
            <button class="back-nav" style="position:static;" onclick="location.href='main.html'">← 메인으로</button>
        </div>

        <div class="header-section">
            <div class="header-brand">
                <img src="logo.png" alt="다함" class="header-logo" onerror="this.style.display='none'">
                <h1 class="header-doc-title">견적서</h1>
            </div>
            <div class="header-contact">
                <div class="contact-name">대표 김재영</div>
                <div class="contact-phone">010.5404.8747</div>
            </div>
        </div>

        <div class="client-info-grid">
            <div class="info-item">
                <label class="info-label">발주처 (고객명)</label>
                <input type="text" id="g-name" class="info-input" placeholder="이름 입력">
            </div>
            <div class="info-item">
                <label class="info-label">연락처</label>
                <input type="tel" id="g-tel" class="info-input" placeholder="010-0000-0000">
            </div>
            <div class="info-item full">
                <label class="info-label">현장 주소</label>
                <input type="text" id="g-addr" class="info-input" placeholder="주소를 입력해주세요">
            </div>
        </div>

        <div class="estimate-table-wrap">
            <div class="grid-row grid-header">
                <div>공정 항목</div>
                <div class="col-center">수량</div>
                <div class="col-center">단가</div>
                <div class="col-right">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>

        <div class="final-total-card">
            <div class="total-label">예상 견적 합계</div>
            <div id="final-sum" class="total-amount">0 원</div>
        </div>
    </div>

    <div class="floating-action-bar no-print">
        <button class="fab-btn btn-reset" onclick="resetForm()">🔄 초기화</button>
        <button class="fab-btn btn-save" onclick="saveToLocal()">💾 임시저장</button>
        <button class="fab-btn btn-print" onclick="smartPrint()">🖨️ 견적발행</button>
        <button class="fab-btn btn-contract" onclick="alert('계약서 기능 준비중')">📑 계약서</button>
    </div>

    <div id="toast-msg" class="toast">저장되었습니다!</div>
    <script src="data.js?v=38"></script>
    <script src="estimate.js?v=38"></script>
</body>
</html>
