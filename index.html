<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다함 인테리어 | 견적 시스템</title>
    
    <link rel="stylesheet" href="style.css?v=final">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
<div class="container">

    <div id="view-general" class="active-view">
        <div class="notice-banner no-print">⚠️ 실측 전 참고용 '공식 가견적서'입니다</div>
        
        <div class="header-card">
            <div class="header-top">
                <div class="logo-box">
                    <img src="logo.png" alt="다함 인테리어" class="img-logo">
                </div>
                <div class="rep-info">
                    <strong>대표 김재영</strong>
                    <div style="color:var(--danger-red); font-weight:700;">010.5404.8747</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="input-group">
                    <label>발주처 (고객명)</label>
                    <input type="text" id="g-name" class="input-field" placeholder="고객 성함">
                </div>
                <div class="input-group">
                    <label>연락처</label>
                    <input type="tel" id="g-tel" class="input-field" placeholder="010.0000.0000" maxlength="13" oninput="autoFormatTel(this)">
                </div>
                <div class="input-group full-row">
                    <label>현장 주소</label>
                    <input type="text" id="g-addr" class="input-field" placeholder="시공 현장 상세 주소">
                </div>
            </div>
        </div>

        <div class="estimate-section">
            <div class="grid-header master-grid">
                <div style="text-align:left;">공정 항목</div>
                <div>수량</div>
                <div style="text-align:right;">단가</div>
                <div style="text-align:right;">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>

        <div class="total-card">
            <div>총 견적 합계</div>
            <div id="final-sum" class="total-val">0 원</div>
        </div>

        <div class="notice-footer no-print">
            <h3>[안내 및 유의사항]</h3>
            <ul>
                <li>본 견적서는 현장 실측 전 작성된 예상 견적서이며, 실제 시공 시 변동될 수 있습니다.</li>
                <li>자재 사양 및 현장 여건에 따라 최종 금액이 확정됩니다.</li>
            </ul>
        </div>
    </div>

    <div id="view-detailed">
        <div class="header-card">
            <div class="header-top">
                <div class="logo-box">
                    <img src="logo.png" alt="다함 인테리어" class="img-logo">
                </div>
                <div class="rep-info">
                    <strong>공급자 : 김재영 (인)</strong>
                    <div style="color:var(--danger-red); font-weight:700;">010.5404.8747</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="input-group full-row"><label>현장 주소</label><input type="text" id="d-addr-display" class="input-field" readonly style="border:none; padding:0;"></div>
                <div class="input-group"><label>발주처</label><input type="text" id="d-name-display" class="input-field" readonly style="border:none; padding:0;"></div>
                <div class="input-group"><label>연락처</label><input type="text" id="d-tel-display" class="input-field" readonly style="border:none; padding:0;"></div>
            </div>
        </div>

        <div class="estimate-section">
            <div class="grid-header detail-grid">
                <div>항목</div><div>사양/모델</div><div>수량</div><div>단가</div><div style="text-align:right;">금액</div>
            </div>
            <div id="detailed-body"></div>
        </div>

        <div class="total-card">
            <div>최종 계약 합계</div>
            <div id="d-total" class="total-val">0 원</div>
        </div>
        
        <div class="no-print" style="margin-top: 30px; text-align: center;">
            <button onclick="backToGeneral()" style="padding: 12px 30px; background: #fff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">
                &lt; 목록으로 돌아가기
            </button>
        </div>
    </div>

    <div class="bottom-action-bar no-print">
        <button class="action-btn btn-reset" onclick="resetForm()">
            <span class="icon">↺</span> <span>초기화</span>
        </button>
        <button class="action-btn btn-save" onclick="saveToLocal()">
            <span class="icon">💾</span> <span>저장</span>
        </button>
        <button class="action-btn btn-print" onclick="smartPrint()">
            <span class="icon">🖨️</span> <span>인쇄</span>
        </button>
        <button class="action-btn btn-next" onclick="switchToDetailed()">
            <span class="icon">➔</span> <span>견적발행</span>
        </button>
    </div>
    
    <div id="toast-msg" class="toast">저장되었습니다.</div>

</div>

<script src="data.js?v=final"></script>
<script src="script.js?v=final"></script>

</body>
</html>
