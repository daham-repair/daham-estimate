<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다함 인테리어 | 통합 견적 시스템</title>
    <link rel="stylesheet" href="style.css?v=23">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
<div class="container">
    <div id="view-general" class="active-view">
        <div class="notice-banner no-print">
            <span>⚠️ 실측 전 참고용 '공식 가견적서'입니다</span>
            <span class="version-badge">Ver 1.13</span>
        </div>

        <div class="header-card">
            <div class="header-top">
                <div class="logo-box">
                    <img src="logo.png" alt="다함 인테리어" class="img-logo">
                </div>
                <h1 class="doc-title">견적서</h1>
                <div class="rep-info">
                    <strong>대표 김재영</strong>
                    <div style="color:var(--danger-red);">010.5404.8747</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="input-group">
                    <label>발주처(고객명)</label>
                    <input type="text" id="g-name" class="input-field" placeholder="고객 성함을 입력하세요">
                </div>
                <div class="input-group">
                    <label>연락처</label>
                    <input type="tel" id="g-tel" class="input-field" placeholder="010.0000.0000" maxlength="13">
                </div>
                <div class="input-group full-row">
                    <label>현장 주소</label>
                    <input type="text" id="g-addr" class="input-field" placeholder="시공할 현장 주소를 입력하세요">
                </div>
            </div>
        </div>
        <div class="estimate-section">
            <div class="grid-header master-grid">
                <div style="text-align:left;">공정 항목</div>
                <div style="text-align:center;">수량</div>
                <div style="text-align:center;">단가</div>
                <div style="text-align:right;">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>
        <div class="total-card">
            <div>예상 견적 합계</div>
            <div id="final-sum" class="total-val">0 원</div>
        </div>
        <div class="notice-footer no-print">
            <h3>[안내 및 면책 공고]</h3>
            <ul>
                <li>본 견적서는 현장 실측 전 작성된 가견적서이며, 최종 계약 시 금액이 확정됩니다.</li>
                <li>현장 여건 및 자재 사양 변경에 따라 최종 단가가 조정될 수 있습니다.</li>
            </ul>
        </div>
    </div>

    <div id="view-detailed">
        <div class="header-card">
            <div class="header-top">
                <div class="logo-box"><img src="logo.png" alt="다함 인테리어" class="img-logo"></div>
                <h1 class="doc-title">계약서</h1>
                <div class="rep-info">
                    <strong>공급자: 김재영 (인)</strong>
                    <div style="color:var(--danger-red);">010.5404.8747</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="input-group"><label>발주처</label><div id="d-name-display" class="display-text"></div></div>
                <div class="input-group"><label>연락처</label><div id="d-tel-display" class="display-text"></div></div>
                <div class="input-group full-row"><label>현장 주소</label><div id="d-addr-display" class="display-text"></div></div>
            </div>
        </div>
        <div class="estimate-section">
            <div class="grid-header detail-grid">
                <div>공정 및 항목</div><div>자재 사양</div><div>수량</div><div>단가</div><div style="text-align:right;">금액</div>
            </div>
            <div id="detailed-body"></div>
        </div>
        <div class="total-card"><div>최종 시공 합계</div><div id="d-total" class="total-val">0 원</div></div>
        
        <div style="height: 60px;"></div> 
    </div>

    <div class="bottom-action-bar no-print">
        <button id="btn-reset" class="action-btn btn-reset" onclick="resetForm()">초기화</button>
        <button id="btn-save" class="action-btn btn-save" onclick="saveToLocal()">임시저장</button>
        <button id="btn-print-est" class="action-btn btn-print" onclick="smartPrint()">견적발행</button>
        <button id="btn-go-contract" class="action-btn btn-next" onclick="switchToDetailed()">계약서</button>

        <button id="btn-back" class="action-btn btn-reset" onclick="backToGeneral()" style="display:none;">목록으로</button>
        <button id="btn-print-cont" class="action-btn btn-print" onclick="printContract()" style="display:none; flex: 2; background:var(--primary-navy);">계약서 출력</button>
    </div>
    <div id="toast-msg" class="toast">저장되었습니다!</div>
</div>
<script src="data.js?v=23"></script>
<script src="script.js?v=23"></script>
</body>
</html>
