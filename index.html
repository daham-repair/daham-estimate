<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 | 다함</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-box">
        <img src="logo.png" alt="다함" class="login-logo" onerror="this.style.display='none'">
        <div class="input-group">
            <input type="text" id="id" class="login-input" placeholder="아이디">
            <input type="password" id="pw" class="login-input" placeholder="비밀번호">
        </div>
        <button class="btn-login" onclick="login()">로그인</button>
    </div>
    <script src="data.js"></script>
    <script>
        function login() {
            if(document.getElementById('id').value && document.getElementById('pw').value) location.href = 'main.html';
            else alert("아이디와 비밀번호를 입력해주세요.");
        }
    </script>
</body>
</html>
