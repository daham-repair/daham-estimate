<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다함 인테리어</title>
    <link rel="stylesheet" href="style.css?v=kakao_style">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
<div class="container">

    <div id="view-general" class="active-view">
        <div class="header-card">
            <div class="header-top">
                <div class="logo-box"><img src="logo.png" alt="다함 인테리어" class="img-logo"></div>
                <div class="rep-info">
                    <strong>대표 김재영</strong>
                    <div>010.5404.8747</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="input-group">
                    <label>고객명</label>
                    <input type="text" id="g-name" class="input-field" placeholder="성함을 입력해주세요">
                </div>
                <div class="input-group">
                    <label>연락처</label>
                    <input type="tel" id="g-tel" class="input-field" placeholder="010.0000.0000" maxlength="13" oninput="autoFormatTel(this)">
                </div>
                <div class="input-group">
                    <label>현장 주소</label>
                    <input type="text" id="g-addr" class="input-field" placeholder="시공 주소">
                </div>
            </div>
        </div>

        <div class="estimate-section">
            <div class="grid-header master-grid">
                <div style="text-align:left;">공정항목</div>
                <div>수량</div>
                <div style="text-align:right;">단가</div>
                <div style="text-align:right;">합계</div>
            </div>
            <div id="estimate-body"></div>
        </div>

        <div class="total-card">
            <div>예상 견적 합계</div>
            <div id="final-sum" class="total-val">0 원</div>
        </div>

        <div class="notice-footer no-print">
            본 견적은 실측 전 가견적이며,<br>현장 상황에 따라 변동될 수 있습니다.
        </div>
    </div>

    <div id="view-detailed">
        <div class="header-card">
            <div class="header-top">
                <div class="logo-box"><img src="logo.png" alt="다함 인테리어" class="img-logo"></div>
                <div class="rep-info">
                    <strong>공급자 : 김재영 (인)</strong>
                    <div>010.5404.8747</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="input-group"><label>주소</label><input type="text" id="d-addr-display" class="input-field" readonly></div>
                <div class="input-group"><label>고객</label><input type="text" id="d-name-display" class="input-field" readonly></div>
                <div class="input-group"><label>연락처</label><input type="text" id="d-tel-display" class="input-field" readonly></div>
            </div>
        </div>

        <div class="estimate-section">
            <div class="grid-header detail-grid">
                <div>항목</div><div>사양</div><div>수량</div><div>단가</div><div style="text-align:right;">금액</div>
            </div>
            <div id="detailed-body"></div>
        </div>

        <div class="total-card">
            <div>최종 계약 합계</div>
            <div id="d-total" class="total-val">0 원</div>
        </div>
        
        <div class="no-print" style="margin-bottom: 120px; text-align: center;">
            <button onclick="backToGeneral()" style="padding:10px 30px; border-radius:20px; border:1px solid #ddd; background:#fff;">
                목록으로 돌아가기
            </button>
        </div>
    </div>

    <div class="bottom-action-bar no-print">
        <button class="action-btn btn-reset" onclick="resetForm()">
            <span class="btn-icon">↺</span>초기화
        </button>
        <button class="action-btn btn-save" onclick="saveToLocal()">
            <span class="btn-icon">💾</span>임시저장
        </button>
        <button class="action-btn btn-print" onclick="smartPrint()">
            <span class="btn-icon">📄</span>견적발행
        </button>
        <button class="action-btn btn-next" onclick="switchToDetailed()">
            <span class="btn-icon">➔</span>계약서
        </button>
    </div>
    
    <div id="toast-msg" class="toast">저장되었습니다!</div>

</div>

<script src="data.js?v=kakao_style"></script>
<script src="script.js?v=kakao_style"></script>

</body>
</html>
